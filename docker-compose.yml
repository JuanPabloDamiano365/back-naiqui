name: naiqui

services:
  # ---------------------------------------------------------------------------
  # Base de datos MySQL
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: naiqui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Se publica en 3307 para no chocar con un MySQL local en 3306.
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Backend Spring Boot
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./naiqui_backend
    container_name: naiqui-backend
    restart: unless-stopped
    environment:
      # Sobrescriben las propiedades de application.properties.
      # "mysql" es el nombre del servicio dentro de la red de Docker.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      NAIQUI_CORS_ALLOWED_ORIGINS: ${NAIQUI_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      NAIQUI_AUTH_COOKIE_SECURE: ${NAIQUI_AUTH_COOKIE_SECURE:-false}
      NAIQUI_AUTH_COOKIE_SAME_SITE: ${NAIQUI_AUTH_COOKIE_SAME_SITE:-Lax}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend React + Vite (servidor de desarrollo con hot reload)
  # ---------------------------------------------------------------------------
  front:
    image: node:22-alpine
    container_name: naiqui-front
    restart: unless-stopped
    working_dir: /app
    environment:
      # Necesario para que Vite detecte cambios sobre el bind mount de Windows.
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ../front-naiqui:/app
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  front_node_modules:
