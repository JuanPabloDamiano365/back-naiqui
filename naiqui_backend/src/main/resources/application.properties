# =====================================================================
# application.properties
# ======================
# Configuración general de la aplicación Spring Boot: nombre, base de
# datos a usar (datasource), y comportamiento de JPA/Hibernate.
# =====================================================================

spring.application.name=naiqui_backend
server.port=8080

naiqui.cors.allowed-origins=${NAIQUI_CORS_ALLOWED_ORIGINS:http://localhost:5173}
naiqui.auth.cookie-secure=${NAIQUI_AUTH_COOKIE_SECURE:false}
naiqui.auth.cookie-same-site=${NAIQUI_AUTH_COOKIE_SAME_SITE:Lax}
naiqui.upload.directory=${NAIQUI_UPLOAD_DIRECTORY:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------
# PERFIL ACTIVO: MySQL
# ---------------------------------------------------------------------
# La aplicación usa MySQL como base de datos principal. Asegurate de tener
# MySQL corriendo en localhost:3306 y de crear la base 'ecommerce_db' antes
# de arrancar la app.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# "update": Hibernate crea/actualiza automáticamente las tablas según las
# entidades (@Entity) definidas en el código. Ideal para desarrollo/TPO.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL generado por Hibernate (útil para entender qué
# hace cada operación de los repositorios).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Con MySQL se activa la carga automática de data.sql para dejar usuarios,
# categorías y productos precargados para probar la API sin crear datos a mano.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
